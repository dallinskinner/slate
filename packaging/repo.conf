# Slate update server. Every Slate install reads packages from REPO_URL, so it is
# baked into slate-desktop (/etc/apt/sources.list.d/slate.sources).
REPO_URL="https://dallinskinner.github.io/slate-updates"
SUITE="stable"
# slate-desktop version: <release>.<fix>. Bump the fix number for every update you publish.
VERSION="0.2.3"
