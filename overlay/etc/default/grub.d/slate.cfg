# Slate GRUB defaults (from the slate-desktop package). Sourced after /etc/default/grub,
# which stays Debian's stock file so GRUB upgrades never ask about local changes.
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_DISTRIBUTOR="Slate"
# os-prober on, so Windows is listed next to Slate
GRUB_DISABLE_OS_PROBER=false
# Plymouth boot splash; keep whatever else the installer put on the command line
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
# Slate menu look: Basalt rock, Hack font, lime selection (/usr/share/grub/themes/slate)
GRUB_THEME=/usr/share/grub/themes/slate/theme.txt
GRUB_GFXMODE=1920x1080,1280x800,auto
